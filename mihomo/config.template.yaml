# 渡口 · 统一线路入口（mihomo 内核）
#
# 这个文件是**模板**，不要直接给 mihomo 用。
# mihomo-keeper.ps1 启动时会探测上游真实端口，把 __占位符__ 换掉，
# 渲染出同目录的 config.yaml，再交给 mihomo。
#
# 为什么需要模板：SSH 隧道的 SOCKS 端口不是固定的
#   （keeper 用 10800，但端口被占时会顺延；手动起的可能落在 10801/10808）。
#   把端口写死，一旦顺延，mihomo 就连到一个死端口，表现是「代理全挂但界面显示正常」。
#   踩过的坑：ports.json 里记 10800，实际在听 10801。

mixed-port: __MIXED_PORT__
external-controller: 127.0.0.1:__API_PORT__
secret: ""
mode: rule
log-level: info
ipv6: false

# 不用 geoip.dat / geosite.dat。
# 为什么：本配置的 rules 只有内网 CIDR + MATCH，一条 GEOIP 都没有 ——
# 那两个文件合计 20 MB，纯占地方（曾经复制过来，后来规则简化后就多余了）。
# 如果将来要加 `GEOIP,CN,DIRECT` 之类的规则，再把它们从
# D:\Clash Verge\resources\ 拷过来。
geodata-mode: false
geo-auto-update: false

# 延迟测两次取平均，避免单次抖动误判线路好坏
unified-delay: true
# 多个解析结果并发连接，先连上的用 —— 断网/弱网时体感提升明显
tcp-concurrent: true

# 不记住上次选中的节点。
# 为什么：默认必须永远是 DIRECT（=没借网）。如果记住上次选择，
# 用户上次开着借网、这次开机时校园网是通的，就会莫名其妙先走隧道。
# 踩过的坑：测试时切到 ferry-wg，重启后 ferry 直接是 ferry-wg，
# 差点误判成「默认值写错了」。
profile:
  store-selected: false
  store-fake-ip: false

# ─────────────────────────── TUN（可选，需管理员）───────────────────────────
#
# 为什么需要 TUN：
#   10810 只是个 SOCKS5/HTTP 端点，只有「认代理设置」的程序能走它。
#   多数游戏客户端、部分桌面软件直接连服务器，根本不看系统代理 ——
#   对它们来说渡口等于不存在。
#   TUN 在网络层截获所有流量（包括 UDP），才能做到「像普通网络一样」。
#
# 为什么默认关闭（tun.enable: false）：
#   TUN 要创建虚拟网卡 + 改路由表，**必须管理员权限**。普通权限下 mihomo
#   会报 `configure tun interface: Access denied` 然后整个进程退出 ——
#   连带把已经能用的 SOCKS 端点也搞没了。
#   所以做成「默认关、提权时才开」，由 mihomo-keeper.ps1 的 -Action TunOn 打开。
#
# 为什么用 gvisor 而不是 system 栈：
#   gvisor 是纯用户态 TCP/IP 实现，不需要额外驱动，兼容性最好。
#   system 栈要内核转发，实测在 Win10 上更容易撞权限/兼容问题。
#
# 为什么 dns-hijack 拦 53：
#   TUN 起来后应用发 DNS 查询会被内核路由进虚拟网卡，但 mihomo 不接管的话
#   这些包就丢了，表现是「能 ping 通 IP、但域名全部解析失败」。
#   拦下 53 端口让 mihomo 自己按 dns 段配置解析。
#
# stack 三选一（实测取舍）：
#   gvisor  —— 用户态，最稳，CPU 略高。默认用它。
#   system  —— 内核栈，性能好，但要求更多。
#   mixed   —— 两者折中，部分场景更快。
tun:
  enable: __TUN_ENABLE__
  stack: gvisor
  device: FerryTun
  # 1500 是常见值。太大在部分校园网/VPN 上会分片失败，太小影响吞吐。
  mtu: 1500
  # auto-route：自动把默认路由指到 TUN。这是「全局接管」的关键。
  auto-route: true
  # auto-detect-interface：自动识别物理出口网卡，避免路由回环
  auto-detect-interface: true
  # strict-route：严格模式，防止流量从物理网卡漏出去（Windows 上偶有问题，
  # 所以默认 false；如果发现「部分流量还是直连」再打开）
  strict-route: false
  dns-hijack:
    - any:53
  # 排除回环和本机链路，避免把自己的代理端口也截进去造成死循环
  route-exclude-address:
    - 127.0.0.0/8
    - 169.254.0.0/16

# TUN 模式下的 DNS。
# 为什么不用系统 DNS：TUN 截了 53 端口，系统 DNS 的响应回不来。
# 让 mihomo 自己解析，再按 rules 决定走哪条线。
# 223.5.5.5 / 119.29.29.29 是国内公共 DNS，走 DIRECT 解析最快；
# 需要借网的域名由 mihomo 通过代理链路解析（proxy-server-nameserver）。
dns:
  enable: true
  ipv6: false
  # fake-ip 让域名解析立刻返回（不等真实 DNS），TUN 场景下体验明显更好。
  # 但有些程序对 fake-ip 不友好（比如自己校验 IP 的），所以 range 用标准值。
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - '*.lan'
    - '*.local'
    - '+.msftconnecttest.com'
    - '+.msftncsi.com'
  nameserver:
    - 223.5.5.5
    - 119.29.29.29
  # 解析代理服务器自己的域名时用这个（避免 fake-ip 把上游地址也劫持了）
  proxy-server-nameserver:
    - 223.5.5.5
    - 119.29.29.29

proxies:
  # 上游一：SSH 动态转发（pcs，联通出口）
  # 只支持 TCP（OpenSSH 的 -D 不实现 SOCKS5 UDP ASSOCIATE）。
  # udp: false 是**故意**的：写 true 会让 mihomo 真的去试 UDP，
  # 每个 UDP 包先失败再回落，游戏/DNS 反而更慢。明确关掉更诚实。
  - name: ferry-ssh
    type: socks5
    server: 127.0.0.1
    port: __SSH_PORT__
    udp: false

  # 上游二：WireGuard 隧道内的远端 SOCKS5（xt，电信出口）
  # 远端 ferry-socks5-server.py 只实现 CONNECT，同样只有 TCP。
  - name: ferry-wg
    type: socks5
    server: 10.66.67.1
    port: 1080
    udp: false

  # 上游三：pcs 上的 UDP 中继（**唯一支持 UDP 的线路**）
  #
  # 这是 ferry-socks5-server.py v2 新增的 UDP ASSOCIATE 能力。
  # 走的是校园网直连（不是 WG、不是 SSH），实测 UDP 往返 6.8ms。
  #
  # 为什么不复用 ferry-ssh：OpenSSH 的 -D 在协议层面就不实现 UDP ASSOCIATE，
  # 那是 ssh 的限制，不是配置问题。
  # 为什么单独起一条而不是替换 ferry-ssh：TCP 走 SSH 更稳（实测 5.2–9.3 MB/s），
  # UDP 才走这条。两条各管一段，规则里按流量类型分流。
  - name: ferry-udp
    type: socks5
    server: __UDP_HOST__
    port: __UDP_PORT__
    udp: true

proxy-groups:
  # 自动线路：按健康检查结果自动选，第一条挂了自动切第二条
  # 只含 TCP 线路 —— UDP 走不了 SSH/WG，见下面的 ferry-udp-group
  - name: ferry-auto
    type: fallback
    proxies: [ferry-ssh, ferry-wg]
    # 用 generate_204 而不是 baidu：204 无正文，判断快且不受页面改版影响
    url: http://connect.rom.miui.com/generate_204
    interval: 30
    tolerance: 50

  # 总开关（TCP）：默认 DIRECT（等于不借网），切到 ferry-auto 就自动借网
  - name: ferry
    type: select
    proxies: [DIRECT, ferry-auto, ferry-ssh, ferry-wg]

  # 总开关（UDP）：**独立的一个组**，因为 UDP 只有一条可用线路。
  #
  # 为什么不把 ferry-udp 塞进上面的 ferry 组：
  #   那个组里有 ferry-ssh / ferry-wg，它们 udp: false。mihomo 选到它们时
  #   UDP 包会被直接丢弃 —— 用户看到的是「开了借网，游戏还是连不上」，
  #   而且没有任何报错可查。
  #   分开之后规则用 NETWORK,udp 精确分流，TCP 和 UDP 各走各的路。
  #
  # 默认也是 DIRECT。On/Off 会同时切两个组，用户仍然只有一个开关。
  - name: ferry-udp-group
    type: select
    proxies: [DIRECT, ferry-udp]

rules:
  # 内网与回环永远直连 —— 借网时如果把这些也代理出去，
  # 局域网里的打印机/共享/远端 SSH 会立刻失联
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  # UDP 单独分流：只有 ferry-udp 这条线路能承载
  - NETWORK,udp,ferry-udp-group
  # 其余（TCP）全部交给 ferry 组决定
  - MATCH,ferry
