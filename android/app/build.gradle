plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ferry.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.ferry.app'
        minSdk 26          // Android 8.0：VpnService + 前台服务语义都稳定
        targetSdk 34
        // 版本号规则（2026-10-30 起重视它，因为有了应用内更新）：
        //   versionCode 必须**单调递增**，它是唯一的更新判据；
        //   versionName 只是给人看的。
        // 改这里之后一定要重新出包上传门户 —— 客户端靠 /android/version
        // 返回的 latestCode 和自己的 versionCode 比。
        versionCode 2
        versionName '0.2.0'

        // 真机只需要两个 arm ABI —— 每多一个 ABI，APK 多一份 .so。
        // x86_64 只在 debug 包里加（见下面的 buildTypes.debug），
        // 那个是给模拟器验证用的，正式包里不需要，省约 400 KB。
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    // .so 必须落盘成真实文件，不能留在 APK 里被压缩。
    // hev-socks5-tunnel 是 JNI 库，System.loadLibrary 在某些设备上
    // 无法从压缩包里直接加载（Android 6+ 默认 extractNativeLibs=false）。
    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    buildTypes {
        release {
            minifyEnabled false      // 先别开混淆：JNI 方法名会被改，排查困难
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix '.debug'
            // 模拟器上跑需要 x86_64 的 .so；真机的 debug 装包也会多带一份，
            // 无所谓（debug 包不上架）。
            ndk {
                abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        // 源码是 UTF-8，中文注释不能靠系统默认编码（Windows 上是 GBK）。
        // 不加这行，javac 会按平台的 ANSI 解码源文件 —— 中文注释变乱码，
        // 而且报错位置指向无关的行，和 .ps1 无 BOM 那个坑是同一类。
        encoding 'UTF-8'
    }

    buildFeatures {
        viewBinding true
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
}
